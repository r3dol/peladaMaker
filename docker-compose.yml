services:
    backend:
      build: .
      command: sh -c "uvicorn app.main:app --reload --port=8000 --host=0.0.0.0"
      env_file:
        - app/env
      ports:
        - 8000:8000
      volumes:
        - .:/app
    db:
      container_name: db
      image: postgres:16-alpine
      ports:
        - '5432:5432'
      volumes:
        - db:/var/lib/postgresql/data
      env_file:
        - .env.local
    test-db:
      container_name: test-db
      image: postgres:16-alpine
      ports:
        - '5433:5432'
      volumes:
        - test-db:/var/lib/postgresql/data
      env_file:
        - .env.local
volumes:
  db:
    driver: local
  test-db:
    driver: local
