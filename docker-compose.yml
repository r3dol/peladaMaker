services:
    backend:
      container_name: backend
      build: .
      env_file:
        - .env.local
      ports:
        - 8000:8000
      depends_on:
        - db
      volumes:
        - .:/app
    db:
      container_name: db
      image: postgres:16-alpine
      ports:
        - "5432:5432"
      volumes:
        - db:/var/lib/postgresql/data
      env_file:
        - .env.local
      restart: always
volumes:
  db:
    driver: local
